integration1:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'integration') }}"
      password: "{{ env_var('DBT_PASSWORD', 'integration') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'integration_db') }}"
      schema: analytics
      threads: 4
