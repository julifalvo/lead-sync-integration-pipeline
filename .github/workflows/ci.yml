name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/api/Dockerfile -t integration1-api .

      - name: Build worker image
        run: docker build -f src/worker/Dockerfile -t integration1-worker .

      - name: Build dashboard image
        run: docker build -f dashboard/Dockerfile -t integration1-dashboard .

      - name: Build scheduler image
        run: docker build -f orchestration/Dockerfile -t integration1-scheduler .
