services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-integration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integration}
      POSTGRES_DB: ${POSTGRES_DB:-integration_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integration}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-integration}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-integration}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI (same user/pass as above)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://integration:integration@postgres:5432/integration_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://integration:integration@rabbitmq:5672/%2F}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://integration:integration@postgres:5432/integration_db}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://integration:integration@rabbitmq:5672/%2F}
    ports:
      - "9100:9100" # Prometheus metrics
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://integration:integration@postgres:5432/integration_db}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://integration:integration@postgres:5432/integration_db}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Optional ops layer: a low-code workflow (orchestration/n8n/lead-ops-alerts.json)
  # that polls the DLQ and would page/alert a human. Not required for the core
  # pipeline -- start it with `docker compose --profile ops up`.
  n8n:
    image: n8nio/n8n:1.69.2
    profiles: ["ops"]
    environment:
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./orchestration/n8n:/workflows:ro
    ports:
      - "5678:5678"

  # Optional SQL mart layer on top of warehouse.leads. One-shot: run with
  # `docker compose --profile dbt run --rm dbt build`.
  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    profiles: ["dbt"]
    env_file: .env
    environment:
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: ${POSTGRES_USER:-integration}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-integration}
      DBT_DBNAME: ${POSTGRES_DB:-integration_db}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8n_data:
